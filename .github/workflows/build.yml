name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  non-revit:
    name: Contracts, Bridge, Server, Addin tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore src/BimIt.Revit.Contracts/BimIt.Revit.Contracts.csproj
          dotnet restore src/BimIt.Revit.Bridge/BimIt.Revit.Bridge.csproj
          dotnet restore src/BimIt.Revit.Server/BimIt.Revit.Server.csproj
          dotnet restore tests/BimIt.Revit.Contracts.Tests/BimIt.Revit.Contracts.Tests.csproj
          dotnet restore tests/BimIt.Revit.Bridge.Tests/BimIt.Revit.Bridge.Tests.csproj
          dotnet restore tests/BimIt.Revit.Server.Tests/BimIt.Revit.Server.Tests.csproj
          dotnet restore tests/BimIt.Revit.Addin.Tests/BimIt.Revit.Addin.Tests.csproj -p:RevitVersion=2026

      - name: Build non-Revit projects
        run: |
          dotnet build src/BimIt.Revit.Contracts/BimIt.Revit.Contracts.csproj --no-restore --configuration Release
          dotnet build src/BimIt.Revit.Bridge/BimIt.Revit.Bridge.csproj --no-restore --configuration Release
          dotnet build src/BimIt.Revit.Server/BimIt.Revit.Server.csproj --no-restore --configuration Release
          dotnet build tests/BimIt.Revit.Contracts.Tests/BimIt.Revit.Contracts.Tests.csproj --no-restore --configuration Release
          dotnet build tests/BimIt.Revit.Bridge.Tests/BimIt.Revit.Bridge.Tests.csproj --no-restore --configuration Release
          dotnet build tests/BimIt.Revit.Server.Tests/BimIt.Revit.Server.Tests.csproj --no-restore --configuration Release
          dotnet build tests/BimIt.Revit.Addin.Tests/BimIt.Revit.Addin.Tests.csproj --no-restore --configuration Release -p:RevitVersion=2026

      - name: Test non-Revit projects
        run: |
          dotnet test tests/BimIt.Revit.Contracts.Tests/BimIt.Revit.Contracts.Tests.csproj --no-build --configuration Release
          dotnet test tests/BimIt.Revit.Bridge.Tests/BimIt.Revit.Bridge.Tests.csproj --no-build --configuration Release
          dotnet test tests/BimIt.Revit.Server.Tests/BimIt.Revit.Server.Tests.csproj --no-build --configuration Release
          dotnet test tests/BimIt.Revit.Addin.Tests/BimIt.Revit.Addin.Tests.csproj --no-build --configuration Release -p:RevitVersion=2026

  addin:
    name: Addin Revit ${{ matrix.revit-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - revit-version: 2025
            target-framework: net8.0-windows
            define: REVIT2025
          - revit-version: 2026
            target-framework: net8.0-windows
            define: REVIT2026
          - revit-version: 2027
            target-framework: net10.0-windows
            define: REVIT2027
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify target framework and version symbol
        shell: pwsh
        run: |
          $project = "src/BimIt.Revit.Addin/BimIt.Revit.Addin.csproj"
          $tfm = (dotnet msbuild $project -nologo -getProperty:TargetFramework -p:RevitVersion=${{ matrix.revit-version }}).Trim()
          $defines = (dotnet msbuild $project -nologo -getProperty:DefineConstants -p:RevitVersion=${{ matrix.revit-version }}).Trim()
          if ($tfm -ne "${{ matrix.target-framework }}") {
            throw "Expected TargetFramework ${{ matrix.target-framework }} for Revit ${{ matrix.revit-version }}, got '$tfm'."
          }
          if ($defines -notmatch "(^|;)${{ matrix.define }}($|;)") {
            throw "Expected DefineConstants to include ${{ matrix.define }} for Revit ${{ matrix.revit-version }}, got '$defines'."
          }
          Write-Host "Revit ${{ matrix.revit-version }} -> $tfm with $defines"

      - name: Build add-in
        run: dotnet build src/BimIt.Revit.Addin/BimIt.Revit.Addin.csproj -p:RevitVersion=${{ matrix.revit-version }} --configuration Release

      - name: Verify version-specific output
        shell: pwsh
        run: |
          $outputDir = "src/BimIt.Revit.Addin/bin/${{ matrix.revit-version }}/Release/${{ matrix.target-framework }}"
          $required = @(
            "BimIt.Revit.Addin.dll",
            "BimIt.Revit.Bridge.dll",
            "BimIt.Revit.Contracts.dll",
            "StreamJsonRpc.dll",
            "Nerdbank.Streams.dll"
          )
          foreach ($name in $required) {
            $path = Join-Path $outputDir $name
            if (-not (Test-Path $path)) {
              throw "Expected runtime payload $path"
            }
          }
          foreach ($name in @("RevitAPI.dll", "RevitAPIUI.dll")) {
            $forbidden = Join-Path $outputDir $name
            if (Test-Path $forbidden) {
              throw "$name must not be copied into add-in output at $outputDir"
            }
          }
          Write-Host "Found required bridge runtime payload in $outputDir without Autodesk Revit API runtime assemblies"

  addin-version-validation:
    name: Addin RevitVersion validation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Missing RevitVersion fails clearly
        shell: cmd
        run: |
          dotnet build src\BimIt.Revit.Addin\BimIt.Revit.Addin.csproj --configuration Release > missing.log 2>&1
          set BUILD_EXIT=%ERRORLEVEL%
          type missing.log
          if %BUILD_EXIT% EQU 0 (
            echo Expected the add-in build to fail when RevitVersion is missing.
            exit /b 1
          )
          findstr /C:"BimIt.Revit.Addin requires an explicit RevitVersion" missing.log
          if errorlevel 1 (
            echo Missing expected error for an unset RevitVersion.
            exit /b 1
          )

      - name: Unsupported RevitVersion fails clearly
        shell: cmd
        run: |
          dotnet build src\BimIt.Revit.Addin\BimIt.Revit.Addin.csproj -p:RevitVersion=2024 --configuration Release > unsupported.log 2>&1
          set BUILD_EXIT=%ERRORLEVEL%
          type unsupported.log
          if %BUILD_EXIT% EQU 0 (
            echo Expected the add-in build to fail when RevitVersion is unsupported.
            exit /b 1
          )
          findstr /C:"Unsupported RevitVersion '2024'" unsupported.log
          if errorlevel 1 (
            echo Missing expected error for an unsupported RevitVersion.
            exit /b 1
          )
