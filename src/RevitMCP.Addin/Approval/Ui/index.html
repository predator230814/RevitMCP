<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Review proposed Revit changes</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <h1>Review proposed Revit changes</h1>
    <p id="idle">No approval request is currently active.</p>
    <section id="review-metadata" hidden>
      <p id="created-at"></p>
      <p id="expires-at"></p>
    </section>
    <section id="items"></section>
    <div class="actions">
      <button id="approve" type="button" disabled>Approve</button>
      <button id="reject" type="button" disabled>Reject</button>
      <button id="cancel" type="button" disabled>Cancel</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
